  supported: true
  docs: https://docs.zenskar.com/reference/idempotent-requests
  notes: >-
    Zenskar publishes a dedicated "Idempotent requests" reference page. Mutating
    (POST) requests can be safely retried using an idempotency key so a repeated
    call does not create duplicate resources.
pagination:
  style: cursor
  params: [next, previous, limit]
  response_fields: [next, previous]
  notes: >-
    List endpoints (contracts, credit notes, contacts, invoices, business
    entities, billable metrics, etc.) use cursor-based pagination. Pass a `next`
    or `previous` cursor plus a `limit`; when no cursor is supplied the first page
    of the result set is returned.
